name: Deploy Let's Talk Renovations to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Rebuild so the compliance and copy checks run on every deploy. Set the repo variable DOMAIN for the custom domain.
      - name: Build the page
        run: node build.mjs
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
